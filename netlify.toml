[build]
  command = "npm run build"
  publish = "dist"

# Optional barcode-lookup proxy (off unless VITE_BARCODE_LOOKUP=on). Netlify serves
# it at /.netlify/functions/barcode-lookup, ahead of the SPA redirect below.
[functions]
  directory = "netlify/functions"

# React Router handles the routes in the browser, so every path must be served
# index.html. Without this, opening /sell directly or refreshing on it returns
# a Netlify 404 instead of the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints filenames in dist/assets, so those are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker, its registration, the manifest and the app shell must never be
# held in the browser's HTTP cache — otherwise a phone keeps serving the old service
# worker and never notices a new deploy. Forcing a revalidate on these is what lets an
# installed app update itself.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
